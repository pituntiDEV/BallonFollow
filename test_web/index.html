<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>BallonFollow - Tracker iPhone</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #fff;
    }

    #app-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Video y Canvas de Fondo */
    #camera-video, #sim-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    /* Canvas de Dibujo (Bounding box, ROI Cancha, Mira) */
    #overlay-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      touch-action: none;
    }

    /* HUD Superior */
    #top-hud {
      position: absolute;
      top: 15px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(10, 20, 15, 0.75);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      z-index: 10;
      font-size: 13px;
    }

    .badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #00e676;
      box-shadow: 0 0 8px #00e676;
    }

    .rec-badge {
      color: #ff3d00;
      display: none;
      align-items: center;
      gap: 4px;
      font-weight: bold;
    }

    .rec-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff3d00;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    /* Controles Inferiores */
    #bottom-bar {
      position: absolute;
      bottom: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .round-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(20, 30, 25, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: transform 0.1s, background 0.1s;
    }

    .round-btn:active {
      transform: scale(0.92);
      background: rgba(0, 230, 118, 0.4);
    }

    #record-btn {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: white;
      border: 4px solid #fff;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    #record-inner {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #ff3d00;
      transition: all 0.2s ease;
    }

    #record-btn.recording #record-inner {
      width: 24px;
      height: 24px;
      border-radius: 4px;
    }

    /* Modo Calibración Banner */
    #calib-notice {
      position: absolute;
      top: 65px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid #00e676;
      border-radius: 12px;
      padding: 6px 14px;
      font-size: 12px;
      color: #00e676;
      z-index: 10;
      text-align: center;
      display: none;
    }

    /* Modal de Permisos de Cámara */
    #permission-modal {
      position: absolute;
      inset: 0;
      background: rgba(10, 15, 12, 0.95);
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px;
      text-align: center;
    }

    #permission-modal h2 {
      font-size: 22px;
      margin-bottom: 12px;
      color: #00e676;
    }

    #permission-modal p {
      font-size: 14px;
      color: #bbb;
      margin-bottom: 24px;
      max-width: 320px;
      line-height: 1.5;
    }

    .action-btn {
      padding: 12px 28px;
      background: #00e676;
      color: #000;
      border: none;
      border-radius: 25px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      margin-bottom: 12px;
    }

    .secondary-btn {
      padding: 10px 20px;
      background: transparent;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 25px;
      font-size: 13px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div id="app-container">
  <!-- Video de Cámara -->
  <video id="camera-video" autoplay playsinline muted></video>
  
  <!-- Canvas de Simulación si no hay cámara -->
  <canvas id="sim-canvas" style="display: none;"></canvas>

  <!-- Canvas de Renderizado de IA -->
  <canvas id="overlay-canvas"></canvas>

  <!-- HUD Superior -->
  <div id="top-hud">
    <div class="badge">
      <div class="status-dot"></div>
      <span id="system-status">IA Rastreando</span>
    </div>
    <div id="rec-indicator" class="rec-badge">
      <div class="rec-dot"></div>
      <span>REC 1080p</span>
    </div>
    <div class="badge" style="color: #69f0ae;">
      <span id="motor-info">Motor: 0%</span>
    </div>
  </div>

  <!-- Notificación de Calibración -->
  <div id="calib-notice">
    ✏️ Modo Calibración: Arrastra los 4 puntos para ajustar las líneas de la cancha
  </div>

  <!-- Controles Inferiores -->
  <div id="bottom-bar">
    <div class="round-btn" id="btn-pan-left" title="Girar Izquierda">◀</div>
    <div class="round-btn" id="btn-calib" title="Calibrar Cancha">📐</div>
    <div id="record-btn">
      <div id="record-inner"></div>
    </div>
    <div class="round-btn" id="btn-mode" title="Cambiar Modo">⚽</div>
    <div class="round-btn" id="btn-pan-right" title="Girar Derecha">▶</div>
  </div>

  <!-- Modal Inicial de Bienvenida y Cámara -->
  <div id="permission-modal">
    <h2>⚽ BallonFollow AI</h2>
    <p>Para probar el encuadre y seguimiento del balón en tu iPhone, habilita la cámara o inicia el modo demostración.</p>
    <button class="action-btn" id="btn-start-camera">Activar Cámara Trasera</button>
    <button class="secondary-btn" id="btn-start-sim">Iniciar Simulación Virtual</button>
  </div>
</div>

<script>
  // ==============================================================
  // Estado y Algoritmos del Seguidor de Balón
  // ==============================================================
  const video = document.getElementById('camera-video');
  const simCanvas = document.getElementById('sim-canvas');
  const overlayCanvas = document.getElementById('overlay-canvas');
  const ctx = overlayCanvas.getContext('2d');
  const simCtx = simCanvas.getContext('2d');

  let isCalibrating = false;
  let isRecording = false;
  let useSimulation = false;
  let activeTouchIndex = null;

  // 4 Puntos de Calibración de Cancha (Normalizados 0.0 - 1.0)
  let courtPolygon = [
    { x: 0.10, y: 0.25 }, // Superior Izquierda
    { x: 0.90, y: 0.25 }, // Superior Derecha
    { x: 0.96, y: 0.92 }, // Inferior Derecha
    { x: 0.04, y: 0.92 }  // Inferior Izquierda
  ];

  // Simulación de Balón
  let ball = {
    x: 0.5,
    y: 0.5,
    vx: 0.008,
    vy: 0.004,
    size: 0.04,
    detected: true
  };

  // Filtro de Kalman 2D
  class KalmanFilter {
    constructor() {
      this.x = 0.5;
      this.vx = 0.0;
      this.dt = 0.033;
      this.p = 1.0;
      this.q = 0.02;
      this.r = 0.05;
    }
    update(measX) {
      this.x += this.vx * this.dt;
      this.p += this.q;
      let k = this.p / (this.p + this.r);
      let error = measX - this.x;
      this.vx += k * (error / this.dt - this.vx);
      this.x += k * error;
      this.p = (1.0 - k) * this.p;
      return this.x;
    }
  }

  // Controlador PID
  class PID {
    constructor() {
      this.kp = 2.0;
      this.deadband = 0.04;
    }
    compute(targetX) {
      let error = targetX - 0.5;
      if (Math.abs(error) < this.deadband) return 0.0;
      return Math.max(-1.0, Math.min(1.0, error * this.kp));
    }
  }

  const kalman = new KalmanFilter();
  const pid = new PID();
  let cameraPanOffset = 0.0;
  let motorSpeed = 0.0;

  // Ajustar tamaño del Canvas
  function resizeCanvas() {
    overlayCanvas.width = window.innerWidth;
    overlayCanvas.height = window.innerHeight;
    simCanvas.width = window.innerWidth;
    simCanvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // Ray-Casting Point-In-Polygon
  function isInsideCourt(px, py) {
    let inside = false;
    let n = courtPolygon.length;
    for (let i = 0, j = n - 1; i < n; j = i++) {
      let xi = courtPolygon[i].x, yi = courtPolygon[i].y;
      let xj = courtPolygon[j].x, yj = courtPolygon[j].y;
      let intersect = ((yi > py) !== (yj > py)) && (px < (xj - xi) * (py - yi) / (yj - yi) + xi);
      if (intersect) inside = !inside;
    }
    return inside;
  }

  // Activar Cámara Trasera en iOS Safari
  document.getElementById('btn-start-camera').addEventListener('click', async () => {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: "environment" },
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        },
        audio: false
      });
      video.srcObject = stream;
      video.play();
      document.getElementById('permission-modal').style.display = 'none';
    } catch (e) {
      console.warn("No se pudo iniciar cámara real (requiere HTTPS o permiso Safari). Iniciando Simulación.", e);
      startSimulationMode();
    }
  });

  document.getElementById('btn-start-sim').addEventListener('click', () => {
    startSimulationMode();
  });

  function startSimulationMode() {
    useSimulation = true;
    simCanvas.style.display = 'block';
    video.style.display = 'none';
    document.getElementById('permission-modal').style.display = 'none';
  }

  // Botón Calibración
  const calibBtn = document.getElementById('btn-calib');
  const calibNotice = document.getElementById('calib-notice');
  calibBtn.addEventListener('click', () => {
    isCalibrating = !isCalibrating;
    calibBtn.style.background = isCalibrating ? 'rgba(0, 230, 118, 0.7)' : 'rgba(20, 30, 25, 0.75)';
    calibNotice.style.display = isCalibrating ? 'block' : 'none';
  });

  // Botón Grabación
  const recordBtn = document.getElementById('record-btn');
  const recIndicator = document.getElementById('rec-indicator');
  recordBtn.addEventListener('click', () => {
    isRecording = !isRecording;
    recordBtn.classList.toggle('recording', isRecording);
    recIndicator.style.display = isRecording ? 'flex' : 'none';
  });

  // Botones de Jog Manual
  document.getElementById('btn-pan-left').addEventListener('pointerdown', () => cameraPanOffset -= 0.05);
  document.getElementById('btn-pan-right').addEventListener('pointerdown', () => cameraPanOffset += 0.05);

  // Gestión Táctil para Mover los Vértices de Calibración
  overlayCanvas.addEventListener('pointerdown', (e) => {
    if (!isCalibrating) return;
    const rect = overlayCanvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width;
    const y = (e.clientY - rect.top) / rect.height;

    for (let i = 0; i < courtPolygon.length; i++) {
      let dx = courtPolygon[i].x - x;
      let dy = courtPolygon[i].y - y;
      if (Math.hypot(dx, dy) < 0.08) {
        activeTouchIndex = i;
        break;
      }
    }
  });

  overlayCanvas.addEventListener('pointermove', (e) => {
    if (!isCalibrating || activeTouchIndex === null) return;
    const rect = overlayCanvas.getBoundingClientRect();
    courtPolygon[activeTouchIndex].x = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    courtPolygon[activeTouchIndex].y = Math.max(0, Math.min(1, (e.clientY - rect.top) / rect.height));
  });

  overlayCanvas.addEventListener('pointerup', () => activeTouchIndex = null);
  overlayCanvas.addEventListener('pointercancel', () => activeTouchIndex = null);

  // ==============================================================
  // Bucle Principal de Renderizado (60 FPS)
  // ==============================================================
  function gameLoop() {
    const W = overlayCanvas.width;
    const H = overlayCanvas.height;

    ctx.clearRect(0, 0, W, H);

    // Si está en modo simulación, dibujar cancha y balón sintéticos
    if (useSimulation) {
      simCtx.fillStyle = '#1e382b';
      simCtx.fillRect(0, 0, W, H);

      // Líneas de cancha sintéticas
      simCtx.strokeStyle = 'rgba(255,255,255,0.4)';
      simCtx.lineWidth = 3;
      simCtx.strokeRect(W * 0.1, H * 0.15, W * 0.8, H * 0.7);
      simCtx.beginPath();
      simCtx.arc(W * 0.5, H * 0.5, H * 0.18, 0, Math.PI * 2);
      simCtx.stroke();
    }

    // Actualizar física del balón simulado
    ball.x += ball.vx;
    ball.y += ball.vy;
    if (ball.x < 0.12 || ball.x > 0.88) ball.vx *= -1;
    if (ball.y < 0.22 || ball.y > 0.85) ball.vy *= -1;

    // Posición aparente en la pantalla (compensada con el giro del motor virtual)
    let apparentX = ball.x - cameraPanOffset;
    apparentX = Math.max(0.05, Math.min(0.95, apparentX));

    // Validar si el balón está dentro de la cancha delimitada
    let inside = isInsideCourt(ball.x, ball.y);

    // Filtro Kalman y PID
    let smoothedX = kalman.update(apparentX);
    if (inside) {
      motorSpeed = pid.compute(smoothedX);
      cameraPanOffset += motorSpeed * 0.015; // Giro suave del soporte hacia el balón
    } else {
      motorSpeed = 0.0;
    }

    document.getElementById('motor-info').textContent = `Motor: ${Math.round(motorSpeed * 100)}%`;

    // 1. Dibujar Polígono de Cancha (ROI)
    ctx.beginPath();
    ctx.moveTo(courtPolygon[0].x * W, courtPolygon[0].y * H);
    for (let i = 1; i < courtPolygon.length; i++) {
      ctx.lineTo(courtPolygon[i].x * W, courtPolygon[i].y * H);
    }
    ctx.closePath();
    ctx.fillStyle = 'rgba(0, 230, 118, 0.08)';
    ctx.fill();
    ctx.strokeStyle = isCalibrating ? '#00e676' : 'rgba(0, 230, 118, 0.6)';
    ctx.lineWidth = 2.5;
    ctx.stroke();

    // Vértices de calibración si el modo está activo
    if (isCalibrating) {
      courtPolygon.forEach((p, idx) => {
        ctx.beginPath();
        ctx.arc(p.x * W, p.y * H, idx === activeTouchIndex ? 18 : 12, 0, Math.PI * 2);
        ctx.fillStyle = '#fff';
        ctx.fill();
        ctx.strokeStyle = '#00e676';
        ctx.lineWidth = 3;
        ctx.stroke();
      });
    }

    // 2. Dibujar Mira Central (Crosshair)
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(W * 0.5 - 20, H * 0.5);
    ctx.lineTo(W * 0.5 + 20, H * 0.5);
    ctx.moveTo(W * 0.5, H * 0.5 - 20);
    ctx.lineTo(W * 0.5, H * 0.5 + 20);
    ctx.stroke();

    // Zona Muerta
    let dbW = W * pid.deadband;
    ctx.strokeStyle = 'rgba(0, 229, 255, 0.2)';
    ctx.strokeRect(W * 0.5 - dbW, H * 0.2, dbW * 2, H * 0.6);

    // 3. Dibujar Balón y Bounding Box
    let bx = apparentX * W;
    let by = ball.y * H;
    let bSize = ball.size * W;

    // Caja de IA
    ctx.strokeStyle = inside ? '#00e676' : '#ff9100';
    ctx.lineWidth = 3;
    ctx.strokeRect(bx - bSize / 2, by - bSize / 2, bSize, bSize);

    // Balón gráfico (si es simulación o preview)
    ctx.beginPath();
    ctx.arc(bx, by, bSize * 0.35, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.strokeStyle = '#222';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Etiqueta de Detección
    ctx.fillStyle = inside ? '#00e676' : '#ff9100';
    ctx.font = 'bold 12px -apple-system, sans-serif';
    ctx.fillText(inside ? '⚽ BALÓN 94%' : '⚠️ FUERA DE CANCHA', bx - bSize / 2, by - bSize / 2 - 8);

    requestAnimationFrame(gameLoop);
  }

  requestAnimationFrame(gameLoop);
</script>
</body>
</html>
