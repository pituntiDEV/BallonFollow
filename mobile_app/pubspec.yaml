name: ball_follower_app
description: Aplicación para seguimiento automático de balón de fútbol mediante IA y soporte motorizado ESP32.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.5+9
  flutter_blue_plus: ^1.31.14
  tflite_flutter: ^0.10.4
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.3
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
